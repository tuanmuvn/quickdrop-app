<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="qdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="qdGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Shield -->
  <rect width="64" height="64" rx="16" fill="#1E293B" />
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#2563EB" stroke-width="2" stroke-opacity="0.4" />
  
  <!-- Outer Radio Waves -->
  <circle cx="32" cy="32" r="24" stroke="#3B82F6" stroke-width="2" stroke-dasharray="4 4" stroke-opacity="0.3" />
  <circle cx="32" cy="32" r="17" stroke="#60A5FA" stroke-width="2" stroke-opacity="0.5" />

  <!-- Center Arrow / Drop Icon -->
  <circle cx="32" cy="32" r="11" fill="url(#qdGrad)" filter="url(#qdGlow)" />
  <path d="M32 26V38M32 38L28 34M32 38L36 34" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
