services:
  quickdrop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quickdrop-app
    restart: unless-stopped
    ports:
      - "8055:8055"
    expose:
      - "8055"
    environment:
      - NODE_ENV=production
      - PORT=8055
      - ROOM_TIMEOUT_MS=600000
      - CHUNK_SIZE=65536
      - RATE_LIMIT_MAX=100
      - CORS_ORIGIN=*
    networks:
      - npm_proxy_network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8055/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  npm_proxy_network:
    external: true
